plugins {
    id 'java-library'
    id 'idea'
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'com.gradleup.shadow' version '9.4.1'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "DyDanmaku-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
}

configurations {
    // Keep the shaded runtime libraries separate from ModDevGradle's game classpath.
    // Otherwise Shadow also copies NeoForge itself into the published mod JAR.
    shade
    implementation.extendsFrom shade
}

dependencies {
    shade('com.google.protobuf:protobuf-java:4.27.2') { transitive = false }
    shade('com.moandjiezana.toml:toml4j:0.7.2') { transitive = false }
    // NeoForge coremods provides Nashorn at runtime. Bundling it again creates a split Java module.
    compileOnly 'org.openjdk.nashorn:nashorn-core:15.4'
    shade('io.netty:netty-codec-http:4.1.97.Final') { transitive = false }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('shadowJar').configure {
    archiveClassifier.set('')
    configurations = [project.configurations.shade]
    mergeServiceFiles()
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'

    relocate 'com.google.protobuf', "${mod_group_id}.dydanmakuforge.shadow.protobuf"
    relocate 'com.moandjiezana.toml', "${mod_group_id}.dydanmakuforge.shadow.toml"
}

tasks.named('jar').configure { enabled = false }
tasks.named('assemble').configure { dependsOn tasks.named('shadowJar') }
tasks.named('build').configure { dependsOn tasks.named('shadowJar') }
