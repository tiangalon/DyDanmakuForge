plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "DyDanmaku-forge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" { source sourceSets.main }
            }
        }

        client {}
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation 'com.google.protobuf:protobuf-java:4.27.2'
    implementation 'com.moandjiezana.toml:toml4j:0.7.2'
    // Forge coremods provides Nashorn at runtime. Bundling it again creates a split Java module.
    compileOnly 'org.openjdk.nashorn:nashorn-core:15.4'
    implementation 'io.netty:netty-codec-http:4.1.81.Final'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            forge_version: forge_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('jar').configure {
    archiveClassifier.set('slim')
    finalizedBy 'reobfJar'
}

tasks.named('shadowJar').configure {
    archiveClassifier.set('')
    mergeServiceFiles()
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'

    dependencies {
        include dependency('com.google.protobuf:protobuf-java:4.27.2')
        include dependency('com.moandjiezana.toml:toml4j:0.7.2')
        include dependency('io.netty:netty-codec-http:4.1.81.Final')
    }

    relocate 'com.google.protobuf', "${mod_group_id}.dydanmakuforge.shadow.protobuf"
    relocate 'com.moandjiezana.toml', "${mod_group_id}.dydanmakuforge.shadow.toml"
    finalizedBy 'reobfShadowJar'
}

tasks.named('assemble').configure { dependsOn tasks.named('shadowJar') }

reobf {
    shadowJar {}
}
